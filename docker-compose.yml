version: "3.9"


x-postgres-environment: &x-postgres-environment
  POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_USER: ${POSTGRES_USER}

x-timescale-environment: &x-timescale-environment
  POSTGRES_SSL_MODE: ${TIMESCALE_SSL_MODE}
  POSTGRES_HOST: ${TIMESCALE_HOST}
  POSTGRES_PORT: ${TIMESCALE_PORT}
  POSTGRES_DB: ${TIMESCALE_DB}
  POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
  POSTGRES_USER: ${TIMESCALE_USER}

x-rabbitmq-variables: &x-rabbitmq-variables
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: ${GOMAXPROCS}
  # App
  APP_NAME: ${APP_NAME}
  APP_VERSION: ${APP_VERSION}
  # HTTP settings
  HTTP_PORT: ${HTTP_PORT}
  HTTP_USE_PREFORK_MODE: ${HTTP_USE_PREFORK_MODE}
  # Logger
  LOG_LEVEL: ${LOG_LEVEL}
  # PG
  PG_POOL_MAX: ${PG_POOL_MAX}
  PG_URL: ${PG_URL}
  # TIMESCALE
  TIMESCALE_POOL_MAX: ${TIMESCALE_POOL_MAX}
  TIMESCALE_URL: ${TIMESCALE_URL}
  # gRPC
  GRPC_PORT: ${GRPC_PORT}
  # RMQ
  RMQ_RPC_SERVER: ${RMQ_RPC_SERVER}
  RMQ_RPC_CLIENT: ${RMQ_RPC_CLIENT}
  RMQ_URL: ${RMQ_URL}
  # NATS
  NATS_RPC_SERVER: ${NATS_RPC_SERVER}
  NATS_URL: ${NATS_URL}
  # Metrics
  METRICS_ENABLED: ${METRICS_ENABLED}
  # Swagger
  SWAGGER_ENABLED: ${SWAGGER_ENABLED}
  # JWT
  JWT_SECRET: ${JWT_SECRET}


services:
  postgres_finnhub:
    container_name: postgres_finnhub
    image: postgres:17-alpine
    environment:
      <<: *x-postgres-environment
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      app_network:
        aliases:
          - postgres.lvh.me

  timescaledb:
    container_name: timescaledb
    image: timescale/timescaledb:latest-pg17
    environment:
      <<: *x-timescale-environment
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      app_network:
        aliases:
          - timescaledb.lvh.me

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.1.4-management
    environment:
      <<: *x-rabbitmq-variables
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      app_network:
        aliases:
          - rabbitmq.lvh.me

  nats:
    container_name: nats
    image: nats:2.11-alpine
    command: [ "-m", "8222", "-sd", "/nats-data", "-user", "guest", "-pass", "guest" ]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/nats-data
    networks:
      app_network:
        aliases:
          - nats.lvh.me

  app:
    container_name: app
    platform: linux/amd64
    pid: "host"
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - postgres_finnhub
      - timescaledb
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  nginx:
    container_name: nginx
    image: nginx:1.29.2-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - rabbitmq
      - app
    networks:
      app_network:
        aliases:
          - nginx.lvh.me


networks:
  app_network:
    external: false


volumes:
  rabbitmq_data:
  nats_data:
  postgres_data:
  timescale_data: